name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run download:fnpack
      - run: npm run pack:fpk
      - name: Read package metadata
        id: package
        run: |
          echo "name=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Upload versioned package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}
          path: |
            dist/app.tgz
            dist/${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.fpk
            .fnos-build/package/manifest
          if-no-files-found: error
